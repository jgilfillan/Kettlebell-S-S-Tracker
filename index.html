<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple & Sinister Tracker</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Roboto+Condensed:wght@300;400;700&display=swap');
    
    :root {
      --primary: #FF4500;
      --secondary: #1a1a1a;
      --accent: #FFD700;
      --bg: #0a0a0a;
      --surface: #1a1a1a;
      --text: #ffffff;
      --text-dim: #999999;
      --success: #00ff88;
      --border: #333333;
    }
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Roboto Condensed', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 20px;
      background-image: 
        radial-gradient(circle at 20% 50%, rgba(255, 69, 0, 0.1) 0%, transparent 50%),
        radial-gradient(circle at 80% 80%, rgba(255, 215, 0, 0.05) 0%, transparent 50%);
    }
    
    .container {
      max-width: 800px;
      margin: 0 auto;
    }
    
    header {
      text-align: center;
      margin-bottom: 40px;
      padding-bottom: 20px;
      border-bottom: 3px solid var(--primary);
      position: relative;
    }
    
    h1 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 3.5rem;
      letter-spacing: 4px;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 10px;
      animation: slideDown 0.6s ease-out;
    }
    
    .subtitle {
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 2px;
      font-size: 0.9rem;
    }
    
    .stats-bar {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 15px;
      margin-bottom: 30px;
      animation: fadeIn 0.8s ease-out 0.2s both;
    }
    
    .stat-card {
      background: var(--surface);
      padding: 20px;
      border-radius: 8px;
      border-left: 4px solid var(--primary);
      transition: all 0.3s ease;
    }
    
    .stat-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(255, 69, 0, 0.2);
    }
    
    .stat-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-dim);
      margin-bottom: 5px;
    }
    
    .stat-value {
      font-size: 2rem;
      font-weight: 700;
      color: var(--primary);
    }
    
    .workout-section {
      background: var(--surface);
      border-radius: 12px;
      padding: 25px;
      margin-bottom: 20px;
      border: 1px solid var(--border);
      animation: slideUp 0.6s ease-out both;
    }
    
    .workout-section:nth-child(2) { animation-delay: 0.1s; }
    .workout-section:nth-child(3) { animation-delay: 0.2s; }
    .workout-section:nth-child(4) { animation-delay: 0.3s; }
    
    .section-header {
      display: flex;
      align-items: center;
      gap: 15px;
      margin-bottom: 20px;
      padding-bottom: 15px;
      border-bottom: 2px solid var(--border);
    }
    
    .section-icon {
      width: 40px;
      height: 40px;
      background: var(--primary);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      flex-shrink: 0;
    }
    
    .section-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.8rem;
      letter-spacing: 2px;
    }
    
    .exercise-group {
      margin-bottom: 20px;
    }
    
    .exercise-name {
      font-weight: 700;
      font-size: 1.1rem;
      margin-bottom: 10px;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    
    .default-weight-control {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 15px;
      padding: 12px;
      background: rgba(255, 215, 0, 0.1);
      border-radius: 6px;
      border: 1px solid rgba(255, 215, 0, 0.3);
    }
    
    .default-weight-control label {
      font-size: 0.9rem;
      color: var(--accent);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    
    .default-weight-control input[type="number"] {
      width: 80px;
      padding: 8px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--text);
      font-size: 1rem;
      font-family: 'Roboto Condensed', sans-serif;
    }
    
    .default-weight-control button {
      padding: 8px 16px;
      background: var(--accent);
      color: var(--bg);
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 600;
      font-family: 'Roboto Condensed', sans-serif;
      text-transform: uppercase;
      letter-spacing: 1px;
      transition: all 0.3s ease;
    }
    
    .default-weight-control button:hover {
      background: var(--primary);
      transform: scale(1.05);
    }
    
    .default-weight-control button:active {
      transform: scale(0.98);
    }
    
    .set-controls {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 10px;
      margin-bottom: 10px;
    }
    
    .set-item {
      background: rgba(255, 255, 255, 0.05);
      padding: 12px;
      border-radius: 6px;
      border: 1px solid var(--border);
      transition: all 0.3s ease;
    }
    
    .set-item.completed {
      background: rgba(0, 255, 136, 0.1);
      border-color: var(--success);
    }
    
    .set-item label {
      display: block;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-dim);
      margin-bottom: 5px;
    }
    
    .set-item input[type="number"],
    .set-item select {
      width: 100%;
      padding: 8px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--text);
      font-size: 1rem;
      font-family: 'Roboto Condensed', sans-serif;
    }
    
    .set-item input[type="checkbox"] {
      width: 20px;
      height: 20px;
      cursor: pointer;
      accent-color: var(--success);
    }
    
    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      padding: 8px;
    }
    
    .warmup-item, .cooldown-item {
      background: rgba(255, 255, 255, 0.05);
      padding: 12px;
      border-radius: 6px;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 12px;
      border: 1px solid var(--border);
      transition: all 0.3s ease;
    }
    
    .warmup-item.completed, .cooldown-item.completed {
      background: rgba(0, 255, 136, 0.1);
      border-color: var(--success);
    }
    
    .warmup-item input, .cooldown-item input {
      width: 20px;
      height: 20px;
      cursor: pointer;
      accent-color: var(--success);
    }
    
    .warmup-item label, .cooldown-item label {
      flex: 1;
      cursor: pointer;
      font-size: 0.95rem;
    }
    
    .action-buttons {
      display: flex;
      gap: 15px;
      margin-top: 30px;
    }
    
    button {
      flex: 1;
      padding: 15px 30px;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.3rem;
      letter-spacing: 2px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s ease;
      text-transform: uppercase;
    }
    
    .btn-primary {
      background: linear-gradient(135deg, var(--primary), #ff6b35);
      color: white;
      box-shadow: 0 4px 15px rgba(255, 69, 0, 0.3);
    }
    
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 25px rgba(255, 69, 0, 0.4);
    }
    
    .btn-secondary {
      background: var(--surface);
      color: var(--text);
      border: 2px solid var(--border);
    }
    
    .btn-secondary:hover {
      border-color: var(--primary);
      color: var(--primary);
    }
    
    .history {
      margin-top: 40px;
      animation: fadeIn 1s ease-out 0.5s both;
    }
    
    .history-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    
    .history-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 2rem;
      letter-spacing: 2px;
    }
    
    .history-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    
    .history-item {
      background: var(--surface);
      padding: 15px 20px;
      border-radius: 8px;
      border-left: 4px solid var(--primary);
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: all 0.3s ease;
    }
    
    .history-item:hover {
      transform: translateX(5px);
      box-shadow: 0 4px 15px rgba(255, 69, 0, 0.2);
    }
    
    .history-date {
      font-size: 0.9rem;
      color: var(--text-dim);
    }
    
    .history-score {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--accent);
    }
    
    .no-history {
      text-align: center;
      padding: 40px;
      color: var(--text-dim);
      font-style: italic;
    }
    
    @keyframes slideDown {
      from {
        opacity: 0;
        transform: translateY(-20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    
    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    
    @keyframes fadeIn {
      from {
        opacity: 0;
      }
      to {
        opacity: 1;
      }
    }
    
    .toast {
      position: fixed;
      bottom: 30px;
      right: 30px;
      background: var(--success);
      color: var(--bg);
      padding: 15px 25px;
      border-radius: 8px;
      font-weight: 700;
      box-shadow: 0 4px 20px rgba(0, 255, 136, 0.4);
      animation: toastIn 0.3s ease-out;
      z-index: 1000;
    }
    
    @keyframes toastIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    
    .timer-controls {
      background: rgba(255, 69, 0, 0.1);
      border: 1px solid rgba(255, 69, 0, 0.3);
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 15px;
    }
    
    .timer-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      padding-bottom: 10px;
      border-bottom: 1px solid rgba(255, 69, 0, 0.3);
    }
    
    .timer-title {
      font-size: 1rem;
      font-weight: 700;
      color: var(--primary);
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    
    .timer-display {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 2.5rem;
      color: var(--primary);
      text-align: center;
      letter-spacing: 2px;
      margin: 10px 0;
    }
    
    .timer-display.active {
      color: var(--success);
      animation: pulse 1s ease-in-out infinite;
    }
    
    .timer-display.rest {
      color: var(--accent);
    }
    
    @keyframes pulse {
      0%, 100% {
        opacity: 1;
      }
      50% {
        opacity: 0.7;
      }
    }
    
    .timer-settings {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 12px;
    }
    
    .timer-input-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    
    .timer-input-group label {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-dim);
    }
    
    .timer-input-group input {
      padding: 8px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--text);
      font-size: 1rem;
      font-family: 'Roboto Condensed', sans-serif;
    }
    
    .timer-presets {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }
    
    .timer-presets button {
      flex: 1;
      padding: 8px;
      font-size: 0.85rem;
      background: rgba(255, 69, 0, 0.2);
      border: 1px solid var(--primary);
      color: var(--primary);
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.3s ease;
      font-family: 'Roboto Condensed', sans-serif;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: 600;
    }
    
    .timer-presets button:hover {
      background: var(--primary);
      color: white;
    }
    
    .timer-action-buttons {
      display: flex;
      gap: 8px;
    }
    
    .timer-action-buttons button {
      flex: 1;
      padding: 12px;
      font-size: 1rem;
      font-family: 'Bebas Neue', sans-serif;
      letter-spacing: 1px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.3s ease;
      text-transform: uppercase;
    }
    
    .timer-btn-start {
      background: var(--success);
      color: var(--bg);
    }
    
    .timer-btn-start:hover {
      box-shadow: 0 4px 15px rgba(0, 255, 136, 0.4);
    }
    
    .timer-btn-stop {
      background: var(--primary);
      color: white;
    }
    
    .timer-btn-stop:hover {
      box-shadow: 0 4px 15px rgba(255, 69, 0, 0.4);
    }
    
    .timer-btn-reset {
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
    }
    
    .timer-btn-reset:hover {
      border-color: var(--primary);
      color: var(--primary);
    }
    
    .timer-status {
      text-align: center;
      font-size: 0.9rem;
      color: var(--text-dim);
      margin-top: 8px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* ── Auth Section ── */
    .auth-section {
      margin-top: 15px;
      padding-top: 15px;
      border-top: 1px solid var(--border);
    }

    .auth-section.firebase-disabled {
      display: none;
    }

    .auth-signed-out {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .auth-note {
      font-size: 0.85rem;
      color: var(--text-dim);
      letter-spacing: 1px;
    }

    .btn-google {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: white;
      color: #444;
      padding: 10px 20px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      font-size: 0.95rem;
      font-family: 'Roboto Condensed', sans-serif;
      font-weight: 600;
      letter-spacing: 0.5px;
      transition: all 0.3s ease;
      flex: 0 0 auto;
    }

    .btn-google:hover {
      box-shadow: 0 4px 15px rgba(255, 255, 255, 0.3);
      transform: translateY(-1px);
    }

    .btn-google svg {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
    }

    .auth-signed-in {
      display: flex;
      align-items: center;
      gap: 12px;
      justify-content: center;
    }

    .user-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 2px solid var(--primary);
    }

    .user-name {
      font-size: 0.95rem;
      color: var(--text);
      font-weight: 600;
    }

    .btn-signout {
      background: transparent;
      color: var(--text-dim);
      border: 1px solid var(--border);
      padding: 6px 14px;
      font-size: 0.8rem;
      border-radius: 4px;
      cursor: pointer;
      font-family: 'Roboto Condensed', sans-serif;
      letter-spacing: 1px;
      text-transform: uppercase;
      transition: all 0.3s ease;
      flex: 0 0 auto;
    }

    .btn-signout:hover {
      border-color: var(--primary);
      color: var(--primary);
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Simple & Sinister</h1>
      <div class="subtitle">Kettlebell Progress Tracker</div>
      <div id="authSection" class="auth-section firebase-disabled">
        <div id="authSignedOut" class="auth-signed-out">
          <p class="auth-note">Sign in to sync workouts across devices</p>
          <button class="btn-google" onclick="signInWithGoogle()">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
              <path fill="#FFC107" d="M43.6 20H24v8h11.3c-1.6 4.4-5.8 7.6-11.3 7.6-6.6 0-12-5.4-12-12s5.4-12 12-12c3 0 5.7 1.1 7.8 2.9l6-6C34.4 5.4 29.5 3.6 24 3.6 12.9 3.6 4 12.5 4 23.6s8.9 20 20 20c11 0 20-8 20-20 0-1.2-.1-2.5-.4-3.6z"/>
              <path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 15.3 18.9 12 24 12c3 0 5.7 1.1 7.8 2.9l6-6C34.4 5.4 29.5 3.6 24 3.6c-7.6 0-14.1 4.4-17.7 11.1z"/>
              <path fill="#4CAF50" d="M24 44c5.3 0 10.1-1.8 13.8-4.7l-6.4-5.3C29.3 35.6 26.8 36.4 24 36.4c-5.4 0-9.9-3.5-11.5-8.3l-6.6 5.1C9.6 39.6 16.3 44 24 44z"/>
              <path fill="#1976D2" d="M43.6 20H24v8h11.3c-.8 2.3-2.4 4.3-4.5 5.7l6.4 5.3C40.8 36 44 30.3 44 24c0-1.2-.1-2.5-.4-3.6z"/>
            </svg>
            Sign in with Google
          </button>
        </div>
        <div id="authSignedIn" class="auth-signed-in" style="display:none">
          <img id="userAvatar" class="user-avatar" src="" alt="Profile">
          <span id="userName" class="user-name"></span>
          <button class="btn-signout" onclick="signOut()">Sign Out</button>
        </div>
      </div>
    </header>
    
    <div class="stats-bar">
      <div class="stat-card">
        <div class="stat-label">Total Workouts</div>
        <div class="stat-value" id="totalWorkouts">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Average Score</div>
        <div class="stat-value" id="avgScore">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Best Score</div>
        <div class="stat-value" id="bestScore">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Current Streak</div>
        <div class="stat-value" id="currentStreak">0</div>
      </div>
    </div>
    
    <div class="workout-section">
      <div class="section-header">
        <div class="section-icon">🔥</div>
        <h2 class="section-title">Warmup</h2>
      </div>
      <div id="warmupList"></div>
    </div>
    
    <div class="workout-section">
      <div class="section-header">
        <div class="section-icon">💪</div>
        <h2 class="section-title">Swings</h2>
      </div>
      <div id="swingsList"></div>
    </div>
    
    <div class="workout-section">
      <div class="section-header">
        <div class="section-icon">⬆️</div>
        <h2 class="section-title">Get-Ups</h2>
      </div>
      <div id="getUpsList"></div>
    </div>
    
    <div class="workout-section">
      <div class="section-header">
        <div class="section-icon">🧘</div>
        <h2 class="section-title">Cooldown</h2>
      </div>
      <div id="cooldownList"></div>
    </div>
    
    <div class="action-buttons">
      <button class="btn-primary" onclick="saveWorkout()">Complete Workout</button>
      <button class="btn-secondary" onclick="resetWorkout()">Reset</button>
    </div>
    
    <div class="history">
      <div class="history-header">
        <h2 class="history-title">Workout History</h2>
        <button class="btn-secondary" onclick="clearHistory()" style="flex: 0 0 auto; padding: 10px 20px; font-size: 1rem;">Clear History</button>
      </div>
      <div class="history-list" id="historyList"></div>
    </div>
  </div>

  <!-- Firebase SDKs (compat mode for vanilla JS) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

  <script>
    // ============================================================
    // FIREBASE CONFIGURATION
    // Replace the placeholder values below with your own Firebase
    // project config.  See the README for full setup instructions.
    // ============================================================
    const FIREBASE_CONFIG = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_PROJECT_ID.appspot.com",
      messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    // Firebase is active only when the config has been filled in.
    const FIREBASE_ENABLED = (
      typeof window.firebase !== 'undefined' &&
      FIREBASE_CONFIG.apiKey &&
      !FIREBASE_CONFIG.apiKey.startsWith('YOUR_')
    );

    let firebaseAuth = null;
    let firebaseDb = null;
    let currentUser = null;

    // ------------------------------------------------------------------
    // Storage layer — swapped out between localStorage and Firestore
    // ------------------------------------------------------------------
    function docId(key) {
      return key.replace('workout:', '');
    }

    function initStorage(user) {
      if (user && firebaseDb) {
        // Firestore-backed storage (keyed per-user)
        const userPath = `users/${user.uid}/workouts`;
        window.storage = {
          async list(prefix) {
            const snapshot = await firebaseDb.collection(userPath).get();
            const keys = snapshot.docs.map(doc => `workout:${doc.id}`);
            return { keys };
          },
          async get(key) {
            const doc = await firebaseDb.collection(userPath).doc(docId(key)).get();
            if (doc.exists) return { value: doc.data().value };
            return null;
          },
          async set(key, value) {
            await firebaseDb.collection(userPath).doc(docId(key)).set({ value });
            return true;
          },
          async delete(key) {
            await firebaseDb.collection(userPath).doc(docId(key)).delete();
            return true;
          }
        };
      } else {
        // LocalStorage fallback (anonymous / Firebase not configured)
        window.storage = {
          async list(prefix) {
            const keys = [];
            for (let i = 0; i < localStorage.length; i++) {
              const key = localStorage.key(i);
              if (key && key.startsWith(prefix)) {
                keys.push(key);
              }
            }
            return { keys };
          },
          async get(key) {
            const value = localStorage.getItem(key);
            return value !== null ? { value } : null;
          },
          async set(key, value) {
            try {
              localStorage.setItem(key, value);
              return true;
            } catch (error) {
              console.error('Storage error:', error);
              throw error;
            }
          },
          async delete(key) {
            localStorage.removeItem(key);
            return true;
          }
        };
      }
    }

    function calculateScore() {
      // Scoring system:
      // Warmup: 10 points (2 per exercise)
      // Swings: 50+ points (5 per set, bonus for heavier weights, bonus for one-handed)
      // Get-ups: 50 points (5 per set, bonus for heavier weights)
      // Cooldown: 10 points (2.5 per exercise)
      
      let score = 0;
      
      // Warmup score
      score += workoutData.warmup.filter(w => w.completed).length * 2;
      
      // Swings score
      workoutData.swings.forEach(swing => {
        if (swing.completed) {
          const baseScore = 5;
          const weightBonus = (swing.weight - 16) / 4; // Bonus for heavier weights
          const typeBonus = swing.swingType === 'one-handed' ? 2 : 0; // Bonus for one-handed swings
          score += baseScore + weightBonus + typeBonus;
        }
      });
      
      // Get-ups score
      workoutData.getUps.forEach(getUp => {
        if (getUp.completed) {
          const baseScore = 5;
          const weightBonus = (getUp.weight - 16) / 4;
          score += baseScore + weightBonus;
        }
      });
      
      // Cooldown score
      score += workoutData.cooldown.filter(c => c.completed).length * 2.5;
      
      return Math.round(score);
    }

    function updateStats(workouts) {
      const totalWorkouts = workouts.length;
      const scores = workouts.map(w => w.score);
      const avgScore = totalWorkouts > 0 ? Math.round(scores.reduce((a, b) => a + b, 0) / totalWorkouts) : 0;
      const bestScore = totalWorkouts > 0 ? Math.max(...scores) : 0;
      
      // Calculate streak (consecutive days with workouts)
      let streak = 0;
      if (workouts.length > 0) {
        const sortedDates = workouts.map(w => new Date(w.date).toDateString()).sort((a, b) => new Date(b) - new Date(a));
        const today = new Date().toDateString();
        
        if (sortedDates[0] === today || sortedDates[0] === new Date(Date.now() - 86400000).toDateString()) {
          streak = 1;
          for (let i = 1; i < sortedDates.length; i++) {
            const prevDate = new Date(sortedDates[i - 1]);
            const currDate = new Date(sortedDates[i]);
            const diffDays = Math.floor((prevDate - currDate) / 86400000);
            
            if (diffDays === 1) {
              streak++;
            } else {
              break;
            }
          }
        }
      }
      
      document.getElementById('totalWorkouts').textContent = totalWorkouts;
      document.getElementById('avgScore').textContent = avgScore;
      document.getElementById('bestScore').textContent = bestScore;
      document.getElementById('currentStreak').textContent = streak;
    }

    // Timer functionality
    class IntervalTimer {
      constructor(type) {
        this.type = type; // 'swings' or 'getups'
        this.maxSets = 10; // total sets for this exercise
        this.workTime = 30; // default 30 seconds
        this.restTime = 0; // default 0 seconds
        this.currentTime = this.workTime;
        this.isRunning = false;
        this.isResting = false;
        this.currentSet = 1;
        this.interval = null;
        this.audioContext = null;
      }
      
      setWorkTime(seconds) {
        this.workTime = seconds;
        if (!this.isRunning) {
          this.currentTime = seconds;
        }
      }
      
      setRestTime(seconds) {
        this.restTime = seconds;
      }
      
      start() {
        if (this.isRunning) return;
        this.isRunning = true;
        this.interval = setInterval(() => this.tick(), 1000);
        this.updateDisplay();
      }
      
      stop() {
        this.isRunning = false;
        if (this.interval) {
          clearInterval(this.interval);
          this.interval = null;
        }
        this.updateDisplay();
      }
      
      reset() {
        this.stop();
        this.isResting = false;
        this.currentTime = this.workTime;
        this.currentSet = 1;
        this.updateDisplay();
      }
      
      tick() {
        this.currentTime--;
        
        if (this.currentTime <= 0) {
          this.playBeep();
          
          if (this.isResting) {
            // Rest period ended, start next work period
            this.isResting = false;
            this.currentSet++;
            this.currentTime = this.workTime;
            
            // Check if we've completed all sets
            if (this.currentSet > this.maxSets) {
              this.stop();
              this.currentSet = this.maxSets;
              showToast(`${this.type === 'swings' ? 'Swings' : 'Get-Ups'} complete!`);
            }
          } else {
            // Work period ended
            if (this.restTime > 0) {
              // Start rest period
              this.isResting = true;
              this.currentTime = this.restTime;
            } else {
              // No rest, start next set immediately
              this.currentSet++;
              this.currentTime = this.workTime;
              
              if (this.currentSet > this.maxSets) {
                this.stop();
                this.currentSet = this.maxSets;
                showToast(`${this.type === 'swings' ? 'Swings' : 'Get-Ups'} complete!`);
              }
            }
          }
        }
        
        this.updateDisplay();
      }
      
      updateDisplay() {
        const displayId = `${this.type}TimerDisplay`;
        const statusId = `${this.type}TimerStatus`;
        const display = document.getElementById(displayId);
        const status = document.getElementById(statusId);
        
        if (display) {
          const minutes = Math.floor(this.currentTime / 60);
          const seconds = this.currentTime % 60;
          display.textContent = `${minutes}:${seconds.toString().padStart(2, '0')}`;
          
          display.className = 'timer-display';
          if (this.isRunning && !this.isResting) {
            display.className = 'timer-display active';
          } else if (this.isRunning && this.isResting) {
            display.className = 'timer-display rest';
          }
        }
        
        if (status) {
          if (this.isRunning) {
            if (this.isResting) {
              status.textContent = `Set ${this.currentSet - 1}/${this.maxSets} - Rest`;
            } else {
              status.textContent = `Set ${this.currentSet}/${this.maxSets} - Working`;
            }
          } else {
            status.textContent = `Ready - Set ${this.currentSet}/${this.maxSets}`;
          }
        }
      }
      
      playBeep() {
        try {
          // Create audio context if it doesn't exist
          if (!this.audioContext) {
            this.audioContext = new (window.AudioContext || window.webkitAudioContext)();
          }
          
          const oscillator = this.audioContext.createOscillator();
          const gainNode = this.audioContext.createGain();
          
          oscillator.connect(gainNode);
          gainNode.connect(this.audioContext.destination);
          
          // Set frequency (higher for end of period)
          oscillator.frequency.value = 800;
          oscillator.type = 'sine';
          
          // Set volume
          gainNode.gain.setValueAtTime(0.3, this.audioContext.currentTime);
          gainNode.gain.exponentialRampToValueAtTime(0.01, this.audioContext.currentTime + 0.3);
          
          oscillator.start(this.audioContext.currentTime);
          oscillator.stop(this.audioContext.currentTime + 0.3);
        } catch (error) {
          console.log('Audio not available:', error);
        }
      }
    }
    
    // Create timer instances
    const swingsTimer = new IntervalTimer('swings');
    const getupsTimer = new IntervalTimer('getups');
    
    function setTimerPreset(type, seconds) {
      const timer = type === 'swings' ? swingsTimer : getupsTimer;
      const inputId = `${type}WorkTime`;
      document.getElementById(inputId).value = seconds;
      timer.setWorkTime(seconds);
      timer.updateDisplay();
    }
    
    function updateTimerWorkTime(type) {
      const timer = type === 'swings' ? swingsTimer : getupsTimer;
      const inputId = `${type}WorkTime`;
      const value = parseInt(document.getElementById(inputId).value) || 30;
      timer.setWorkTime(value);
      timer.updateDisplay();
    }
    
    function updateTimerRestTime(type) {
      const timer = type === 'swings' ? swingsTimer : getupsTimer;
      const inputId = `${type}RestTime`;
      const value = parseInt(document.getElementById(inputId).value) || 0;
      timer.setRestTime(value);
    }
    
    function startTimer(type) {
      const timer = type === 'swings' ? swingsTimer : getupsTimer;
      timer.start();
    }
    
    function stopTimer(type) {
      const timer = type === 'swings' ? swingsTimer : getupsTimer;
      timer.stop();
    }
    
    function resetTimer(type) {
      const timer = type === 'swings' ? swingsTimer : getupsTimer;
      timer.reset();
    }
    
    // Initialize
    renderWarmup();
    renderSwings();
    renderGetUps();
    renderCooldown();
    // When Firebase is enabled, loadHistory() is called from onAuthStateChanged.
    if (!FIREBASE_ENABLED) {
      loadHistory();
    }
  </script>
</body>
</html>
